[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arena-vllm-ampere-ple"
version = "0.1.0"
description = "Byte-preserving A100 PLE lookup compatibility for the pinned vLLM API"
requires-python = ">=3.11"

[project.entry-points."vllm.general_plugins"]
ampere_ple_patch = "ampere_ple_patch:register"

[tool.setuptools]
py-modules = ["ampere_ple_patch"]
