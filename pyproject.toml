[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-proof-eval"
version = "0.3.0"
description = "Lean Refactor Arena verification, optimization, and agent harness"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
semantic = ["lean-explore[local]==1.3.0"]
dev = [
    "black==26.10.0",
    "ruff==0.14.14",
    "pytest>=9.1,<10",
    "pytest-subtests==0.14.2",
]

[project.scripts]
proof-eval = "proof_eval.interfaces.cli:main"
proof-harness = "proof_eval.harness.cli:main"
proof-deterministic = "proof_eval.optimization.cohort_cli:main"
proof-transform = "proof_eval.optimization.runner:main"
proof-transform-study = "proof_eval.optimization.study:main"
proof-search-study = "proof_eval.optimization.exploration_study:main"
proof-benchmark = "proof_eval.benchmark.process:main"
proof-setup = "proof_eval.benchmark.setup:main"
proof-audit = "proof_eval.evidence.audit:main"
proof-watch = "proof_eval.evidence.watch:main"
proof-report = "proof_eval.optimization.reporting:main"
proof-corpus = "proof_eval.interfaces.corpus:main"
proof-train = "proof_eval.interfaces.training:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proof_eval = ["benchmark/*.lean"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: explicit paid model or remote provider integration"]

[tool.black]
line-length = 88
target-version = ["py310"]
# This exact source is part of the existing reference environment fingerprints.
# A new backend release requires separately prepared reference measurements.
force-exclude = "(/results/|src/proof_eval/verification/backend\\.py$)"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["results", ".proof-eval", ".proof-eval-projects"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Verify correctness rules, but preserve the pinned measurement source bytes.
"src/proof_eval/verification/backend.py" = ["I"]
