[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-proof-eval"
version = "0.1.0"
description = "Local, cached evaluation of Lean Refactor Arena candidates"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
proof-eval = "proof_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
